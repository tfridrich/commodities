name: Update oil and gas prices and publish site

on:
  schedule:
    # NYMEX settles oil at 14:30 and natural gas at 14:30 New York time; ICE Endex TTF settles
    # around 17:30 CET. 22:23 UTC (Mon-Fri) catches the day's settlements; 06:23 UTC
    # (Tue-Sat) is a catch-up run in case Yahoo was late or a run failed.
    - cron: "23 22 * * 1-5"
    - cron: "23 6 * * 2-6"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download the full price history (type yes)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tb-update          # same group as the power-price workflow, so the two never push at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch oil and gas prices and forward curves
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}   # optional; adds the official EIA spot prices
        run: |
          if [ "${{ github.event.inputs.full }}" = "yes" ]; then
            python scripts/update_oil_gas.py --full
          else
            python scripts/update_oil_gas.py
          fi

      - name: Save updated data to the repository
        run: |
          git config user.name "tb-spread-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/oil_gas.json docs/data/oil_gas_curves.json
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update oil and gas prices $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
